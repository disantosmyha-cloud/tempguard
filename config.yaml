# temguard 配置 —— 改完直接重启 python main.py 即可，不用动代码。

sample:
  interval_seconds: 5          # 每隔多少秒检查一次
  log_file: logs/temps.csv     # 温度日志路径（会自动建表头）
  max_log_bytes: 20971520      # CSV 超过 20MB 自动轮转

thresholds:
  # 所有温度阈值单位都是 °C，取 CPU/GPU 中最热的那个来判断。
  warning_c: 90                # 达到这个温度就进入“警告”
  terminate_c: 93              # 连续 ≥ 这个温度满 terminate_seconds 就“终止进程”
  shutdown_c: 95               # 连续 shutdown_samples 次 ≥ 这个温度就“关机”
  reset_c: 88                  # 低于这个温度算恢复正常，所有计时/计数清零
  terminate_seconds: 1200      # 20 分钟
  shutdown_samples: 3          # 连续 3 次

safety:
  # 开机/刚启动时的传感器可能报出假高温（例如 100°C+），不能据此关机。
  startup_grace_seconds: 180   # 冷启动后 180 秒内只警告，不终止/关机
  require_cool_baseline: true  # 必须先读到一次低于 warning_c 的正常温度，才允许动作
  sensor_stale_seconds: 20     # 温度读数超过多少秒算失效
  sensor_loss_seconds: 300     # 全部温度源失效持续多少秒
  sensor_loss_action: "warn"   # warn 或 shutdown（本机可设 shutdown）

actions:
  dry_run: true                # 公开版默认演习；本机真实参数放 config.local.yaml
  terminate_processes:         # 熔断时要终止的进程名，不区分大小写
    - blender.exe
    - python.exe
  shutdown_delay_seconds: 60   # 真关机时留给你的取消时间；取消命令：shutdown /a
  retry_seconds: 60            # 终止/关机失败后的重试间隔
  protect_keywords:            # 命令行包含这些词的进程不终止（保护告警服务）
    - astrbot
    - alertd

sensors:
  cpu: true                    # 关掉后不再读 CPU 温度
  gpu: true                    # 关掉后不再读 GPU 温度

monitor:
  heartbeat_url: ""            # 可选：外部 dead-man switch，例如 healthchecks.io
  heartbeat_interval_seconds: 60
  heartbeat_token: ""

alertd:
  host: "127.0.0.1"            # 只监听本机
  port: 8765
  token: ""                    # 本机可选鉴权；只填 config.local.yaml
  db_file: logs/alerts.db      # 持久化 outbox
  log_file: logs/alerts.jsonl
  max_pending: 1000
  workers: 2
  wait_default_seconds: 10
  retention_days: 30
  max_history: 10000
  retry_attempts: 3
  retry_backoff_seconds: 2
  max_attempts: 3
  circuit_failures: 3
  circuit_cooldown_seconds: 60
  required_adapters: []        # 例如 ["email"]；TRIP 必须由这些适配器确认

  # 可插拔适配器；全部不依赖 AstrBot（AstrBot 只是其中一个可选适配器）
  adapters:
    - name: wecom-group
      type: wecom
      enabled: false
      webhook: ""
      mentioned_list: []
      mentioned_mobile_list: []
      timeout_seconds: 5

    - name: feishu
      type: feishu
      enabled: false
      webhook: ""
      secret: ""
      timeout_seconds: 5

    - name: dingtalk
      type: dingtalk
      enabled: false
      webhook: ""
      secret: ""
      timeout_seconds: 5

    - name: telegram
      type: telegram
      enabled: false
      bot_token: ""
      chat_id: ""
      api_base: "https://api.telegram.org"
      timeout_seconds: 5

    - name: discord
      type: discord
      enabled: false
      webhook: ""
      username: "temguard"
      timeout_seconds: 5

    - name: slack
      type: slack
      enabled: false
      webhook: ""
      channel: ""
      timeout_seconds: 5

    - name: email
      type: email
      enabled: false
      smtp_host: ""
      smtp_port: 465
      use_ssl: true
      starttls: false
      username: ""
      password: ""
      from_addr: ""
      to_addrs: []
      timeout_seconds: 10

    - name: qq-onebot
      type: qq_onebot
      enabled: false
      base_url: "http://127.0.0.1:3000"
      access_token: ""
      target_type: "group"      # group 或 private
      target_id: ""
      timeout_seconds: 5

    - name: personal-wechat-ilink
      type: wechat_ilink
      enabled: false
      base_url: "https://ilinkai.weixin.qq.com"
      bot_token: ""
      to_user_id: ""
      context_token: ""
      timeout_seconds: 15

    - name: wechat-bridge
      type: wechat_hook
      enabled: false
      url: "http://127.0.0.1:8080/send"
      token: ""
      timeout_seconds: 5

notify:
  print: true                  # 打印到屏幕
  mode: direct                 # direct=temguard 自己发；alertd=投递给独立告警服务
  critical_wait_seconds: 10    # 关机/终止进程前，等待告警确认送达的最长秒数

  # 独立告警服务 alertd：temguard 只 POST 到这里
  alertd:
    enabled: false
    url: "http://127.0.0.1:8765/alert"
    token: ""                  # 和 alertd.token 一致；只填 config.local.yaml
    timeout_seconds: 3

  # AstrBot Open API：把告警交给 AstrBot，由它路由到已接好的微信/QQ/飞书/钉钉等
  astrbot:
    enabled: false
    base_url: "http://127.0.0.1:6185"
    api_key: ""                # 只填在 config.local.yaml
    umos: []                   # 目标会话，格式 platform_id:消息类型:session_id
    timeout_seconds: 5

  # 企业微信群机器人：不经过 AstrBot 的备用直连通道
  wechat:
    webhook: ""                # 企业微信群机器人 webhook；只填在 config.local.yaml
    mentioned_list: []         # 例如 ["@all"] 或 ["zhangsan"]
    mentioned_mobile_list: []  # 例如 ["13800138000"]
    timeout_seconds: 5         # 微信请求超时时间（秒）

  # 邮件：AstrBot 不负责邮件，这里走 SMTP
  email:
    enabled: false
    smtp_host: ""              # 例如 smtp.qq.com
    smtp_port: 465
    use_ssl: true
    starttls: false            # 用 587 端口时通常设为 true
    username: ""
    password: ""               # 授权码，只填在 config.local.yaml
    from_addr: ""
    to_addrs: []               # 例如 ["you@example.com"]
    timeout_seconds: 10

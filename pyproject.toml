[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tempguard"
version = "1.5.1"
description = "Windows CPU/GPU temperature watchdog with persistent alert outbox"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "PyYAML>=6.0,<7",
    "psutil>=5.9,<8",
]

[project.optional-dependencies]
gpu = ["pynvml>=11,<13"]
dev = ["coverage>=7", "ruff>=0.5"]

# 入口仍使用项目根目录的 `python main.py` / `python alertd.py`。
# 不把 main.py / core / adapters 安装成顶层模块：这些名字太通用，容易和其他包冲突。
# pyproject 只负责元数据、依赖边界和开发工具配置。

[tool.setuptools]
packages = []

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.coverage.run]
branch = true
source = ["core", "adapters", "main", "alertd"]

[tool.coverage.report]
show_missing = true
